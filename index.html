<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daksh Studio - Job Portal</title>
    <style>
        body { background: #0d0d12; color: white; font-family: sans-serif; margin: 0; }
        .container { padding: 20px; }
        .card { background: #1a1a24; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #2a2a35; }
        .btn { background: linear-gradient(90deg, #00f3ff, #b026ff); border: none; padding: 12px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        #home-screen { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #0d0d12; color: white; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="auth-screen" class="container">
    <h1>Login to Daksh Studio</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
</div>

<!-- HOME SCREEN -->
<div id="home-screen" class="container">
    <nav style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Daksh Studio</h2>
        <button onclick="logout()" style="background:transparent; border:1px solid #444; color:white; padding:5px 10px; cursor:pointer;">Logout</button>
    </nav>
    
    <div class="card">
        <h3>Profile Settings</h3>
        <p>Edit your portfolio and studio details here.</p>
        <button class="btn">Update Profile</button>
    </div>

    <div class="card">
        <h3>Find Jobs by Location</h3>
        <input type="text" placeholder="Enter City (e.g. Khandwa, Indore)">
        <button class="btn">Search Jobs</button>
        <div id="job-list" style="margin-top:15px;">
            <p>• Video Editor - Khandwa</p>
            <p>• Graphic Designer - Indore</p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        auth.signInWithEmailAndPassword(e, p)
        .then(() => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
        })
        .catch(err => alert(err.message));
    }

    function logout() { auth.signOut().then(() => location.reload()); }
</script>

</body>
</html>
